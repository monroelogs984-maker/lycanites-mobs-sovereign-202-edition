# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#read more on this at https://github.com/neoforged/NeoGradle/blob/NG_7.0/README.md#apply-parchment-mappings
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.251
loader_version_range=[1,)

## Mod Properties

# Matches the original Forge mod's id exactly so existing addons (Lycanites Kin, lycanoculus,
# Lycanite's Companions) and any datapacks referencing the lycanitesmobs: namespace keep working.
mod_id=lycanitesmobs
mod_name=Lycanites Mobs
# Ported mod: license inherited from the original per workspace convention (see CLAUDE.md).
# The LICENSE file content (Lycanite Mob Public License) is authoritative over the upstream
# repo's own gradle.properties, which inconsistently labels it "GNU GPL" - see the LICENSE file.
mod_license=Lycanite Mob Public License
mod_version=0.1.0-neoforge-alpha
mod_group_id=com.lycanitesmobs
mod_issue_tracker_url=https://gitlab.com/Lycanite/LycanitesMobs/issues
mod_display_url=https://lycanitesmobs.com
mod_logo_file=lycanitesmobs.png
mod_credits=Original mod by Lycanite (Richard Nicholson), maintained by Liopyu. NeoForge 1.21.1 port for Sovereign 202 by Glenn.
mod_authors=Lycanite (Richard Nicholson), Liopyu (original mod); Glenn (NeoForge 1.21.1 port)
mod_description=NeoForge 1.21.1 port of Lycanites Mobs, adapted as the core creature mod for Sovereign 202. Ported from the official Forge 1.20.1-dev source (gitlab.com/Lycanite/LycanitesMobs).
oculus_version_range=[1.6.0,)
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk
